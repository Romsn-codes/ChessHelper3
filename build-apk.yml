
name: Build ChessHelper APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ChessHelper (1).zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ChessHelper
        run: |
          unzip -q "ChessHelper (1).zip" -d /tmp/source
          cp -a /tmp/source/ChessHelper/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "Using SDK manager: $SDKMANAGER"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "SDK manager not found"
            find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Download Stockfish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEST=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST" /tmp/sf
          cd /tmp/sf

          gh release download sf_18 \
            -R official-stockfish/Stockfish \
            -p '*android-armv8*'

          ARCHIVE=$(ls | grep -v dotprod | head -n 1)

          case "$ARCHIVE" in
            *.tar|*.tar.gz|*.tar.xz|*.tgz)
              tar -xf "$ARCHIVE"
              ;;
            *.zip)
              unzip -q "$ARCHIVE"
              ;;
            *)
              echo "Unknown archive: $ARCHIVE"
              exit 1
              ;;
          esac

          BIN=$(find . -type f -name 'stockfish*' \
            ! -name '*.txt' ! -name '*.md' | head -n 1)

          if [ -z "$BIN" ]; then
            echo "Stockfish binary not found"
            exit 1
          fi

          cp "$BIN" "$GITHUB_WORKSPACE/$DEST/libstockfish.so"
          chmod +x "$GITHUB_WORKSPACE/$DEST/libstockfish.so"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
